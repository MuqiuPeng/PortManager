[workspace]
resolver = "2"
members = [
    "crates/runtime-types",
    "crates/runtime-adapter",
    "crates/adapter-macos",
    "crates/adapter-windows",
    "crates/runtime-core",
    "crates/runtime-ipc",
    "crates/runtime-daemon",
    "crates/runtime-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/guanshunpeng/local-runtime"

[workspace.dependencies]
runtime-types = { path = "crates/runtime-types" }
runtime-adapter = { path = "crates/runtime-adapter" }
adapter-macos = { path = "crates/adapter-macos" }
adapter-windows = { path = "crates/adapter-windows" }
# Default off so a member can be type-checked for another platform; the
# members that ship turn it back on through their own `bundled-sqlite`.
runtime-core = { path = "crates/runtime-core", default-features = false }
runtime-ipc = { path = "crates/runtime-ipc", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
rusqlite = { version = "0.32", default-features = false, features = ["chrono"] }
clap = { version = "4", features = ["derive", "env"] }
sysinfo = "0.32"
directories = "5"
