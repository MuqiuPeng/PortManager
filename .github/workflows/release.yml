name: release

# Tagged, and the tag is the version.
#
# One source for it: the tag is written into `tauri.conf.json` before the build,
# so the number in the bundle, the number in `latest.json` and the number
# somebody typed cannot disagree. Nothing in the repository carries a version
# that has to be remembered and bumped.
on:
  push:
    tags: ["v*"]
  # For rehearsing the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar: runtime-daemon-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: runtime-daemon-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: The version everything is built as
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          # Said out loud and checked, because the failure downstream does not
          # name this: an empty version reaches `tauri-action` as "Could not
          # determine package name and version", which reads like a missing
          # manifest rather than a blank field.
          if [ -z "$version" ]; then
            echo "no version to build as: ref '${GITHUB_REF_NAME}', input '${{ inputs.version }}'" >&2
            exit 1
          fi
          echo "building as $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Passed as an argument, not through the environment. This step used
          # to set `VERSION: ""` in its own `env:` and read it back with
          # `process.env.VERSION ?? '...'` — but `??` falls back on null and
          # undefined, not on the empty string, so the fallback never ran and
          # every build was stamped with no version at all. `GITHUB_ENV` only
          # reaches later steps, so there was nothing else for it to read.
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.argv[1];
            if (!conf.version) throw new Error("refusing to write an empty version");
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          # Proof, in the log, that the number in the bundle is the number asked
          # for — the one fact this whole step exists to establish.
          node -e '
            const conf = require("./apps/desktop/src-tauri/tauri.conf.json");
            console.log("tauri.conf.json version is now: " + JSON.stringify(conf.version));
          '

      # The three binaries ship together, so they are built together. The app
      # carries the daemon as a sidecar and the CLI beside it; an update that
      # moved one without the others is how a CLI ends up speaking a protocol
      # its daemon has stopped accepting.
      - name: Build the binaries the app carries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p runtime-daemon -p runtime-cli
          mkdir -p apps/desktop/src-tauri/binaries
          ext=""
          [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/runtime-daemon$ext" \
             "apps/desktop/src-tauri/binaries/runtime-daemon-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/runtime$ext" \
             "apps/desktop/src-tauri/binaries/runtime-${{ matrix.target }}$ext"

      - name: Build the MCP server the app carries
        run: pnpm --dir packages/runtime-mcp install --frozen-lockfile=false && pnpm --dir packages/runtime-mcp build

      - name: Frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile=false

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not code signing — this is the updater's own signature, which is
          # what lets an installed copy tell a real update from anything else
          # that answers the endpoint.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Local Runtime v__VERSION__
          releaseBody: |
            Unsigned, so the first launch needs a word from you.

            **Windows** — run the `.exe`. SmartScreen will warn about an
            unrecognised publisher: More info, then Run anyway.

            **macOS** — download from a terminal and there is nothing to do
            afterwards. The "damaged" message Gatekeeper gives an unnotarised
            app comes from a flag that browsers attach to what they save, and
            command-line tools do not:

                gh release download --repo MuqiuPeng/PortManager --pattern '*.dmg' --dir ~/Downloads

            If you already downloaded it in a browser, clear the flag:

                /usr/bin/xattr -cr "/Applications/Local Runtime.app"

            The absolute path is deliberate: Anaconda ships an `xattr` that
            does not understand `-r` and fails as though the command were
            mistyped.

            Updates after this one are verified against the key this release
            was signed with, and arrive in the app.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          args: --target ${{ matrix.target }}
