[package]
name = "adapter-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS implementation of the runtime OS adapter traits."

[dependencies]
runtime-types = { workspace = true }
runtime-adapter = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Already in the tree via tao/wry; used directly so the panel work stays behind
# the adapter boundary instead of leaking AppKit into the desktop app.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSPanel",
    "NSScreen",
    "NSResponder",
    "NSEvent",
    "NSApplication",
] }
objc2-foundation = "0.3"
