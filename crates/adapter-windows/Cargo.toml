[package]
name = "adapter-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows implementation of the runtime OS adapter traits."

[dependencies]
runtime-types = { workspace = true }
runtime-adapter = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # `CreateJobObjectW` takes SECURITY_ATTRIBUTES, which lives here.
    "Win32_Security",
] }
