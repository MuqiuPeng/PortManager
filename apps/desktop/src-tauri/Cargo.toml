[package]
name = "runtime-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop app for the local runtime manager."

[lib]
name = "runtime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
adapter-macos = { workspace = true }
objc2-app-kit = { version = "0.3", features = ["NSEvent"] }

[dependencies]
runtime-types = { workspace = true }
runtime-core = { workspace = true }
runtime-adapter = { workspace = true }
runtime-ipc = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
