[package]
name = "runtime-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop app for the local runtime manager."

[lib]
name = "runtime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Every crate that ships a binary turns bundled SQLite back on, because the
# workspace switches it off so a member can be type-checked for another
# platform. This one did not, and only macOS hid it: there is a system
# libsqlite3 to link against there and none on Windows, so the app built here
# and died at `LNK1181: cannot open input file 'sqlite3.lib'` there — including
# inside `tauri-action`, which is how the exe was going to be released.
[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["runtime-core/bundled-sqlite", "runtime-ipc/bundled-sqlite"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
adapter-macos = { workspace = true }
objc2-app-kit = { version = "0.3", features = ["NSEvent"] }

[dependencies]
runtime-types = { workspace = true }
runtime-core = { workspace = true }
runtime-adapter = { workspace = true }
runtime-ipc = { workspace = true }
# `macos-private-api` backs the transparent panel window: without it the webview
# paints an opaque rectangle and the panel's rounded corners show as white
# squares. It rules out the Mac App Store, which is not a distribution channel
# for a tool that manages local processes anyway.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
# Only for `relaunch` after an update: the new binary is on disk and the old
# one is still running it.
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3.27.0"
